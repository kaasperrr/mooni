<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Вход — Mooni</title>
<link rel="icon" href="../assets/logo/logo-icon.svg" type="image/svg+xml">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="auth-wrap">
  <div class="auth-card">
    <img class="mascot" src="../assets/mascot/mascot-1-classic.svg" alt="Муни">
    <h1>Привет снова!</h1>
    <p class="sub">Войдите, чтобы продолжить обучение</p>

    <form id="loginForm" onsubmit="event.preventDefault(); window.location.href='courses.html';">
      <div class="field">
        <label for="email">Почта родителя</label>
        <input type="email" id="email" placeholder="name@example.com" required>
      </div>
      <div class="field">
        <label for="password">Пароль</label>
        <input type="password" id="password" placeholder="••••••••" required>
      </div>
      <button type="submit" class="btn btn--primary">Войти</button>
    </form>

    <p class="auth-switch">Нет аккаунта? <a href="#">Зарегистрироваться</a></p>
    <p class="auth-switch"><a href="index.html">← На главную</a></p>
  </div>
</div>
</body>
</html>
